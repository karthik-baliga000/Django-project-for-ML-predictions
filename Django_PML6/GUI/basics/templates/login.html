<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login – BananaML</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --orange: #F5A623; --dark: #1a1a1a; --light: #FFFDF7; }
  body {
    font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--light); border-radius: 16px; padding: 3rem 2.5rem;
    width: 100%; max-width: 420px; box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }
  .logo { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--orange); margin-bottom: 0.3rem; }
  h2 { font-family: 'Syne', sans-serif; font-size: 1.8rem; margin-bottom: 0.5rem; }
  .subtitle { color: #777; margin-bottom: 2rem; font-size: 0.9rem; }

  .alert { background: #ffe5e5; color: #c0392b; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; }

  label { display: block; font-weight: 500; margin-bottom: 0.4rem; font-size: 0.9rem; }
  input {
    width: 100%; padding: 0.75rem 1rem; border: 2px solid #ddd;
    border-radius: 8px; font-size: 1rem; font-family: inherit;
    background: white; transition: border-color 0.2s; margin-bottom: 1.2rem;
  }
  input:focus { outline: none; border-color: var(--orange); }
  button {
    width: 100%; background: var(--dark); color: white; border: none;
    padding: 0.9rem; border-radius: 8px; font-size: 1rem;
    font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--orange); color: var(--dark); }
  .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #777; }
  .footer-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌿 ML Predictor</div>
  <h2>Welcome back</h2>
  <p class="subtitle">Log in to start prediction</p>

  {% if messages %}
    {% for message in messages %}
      <div class="alert">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter your username" required>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Login →</button>
  </form>
  <p class="footer-link">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
</div>
</body>
</html>
